
# Datasource H2 (banco descartável para testes de integração)

spring.datasource.url=jdbc:h2:mem:conectapro_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hikari — desabilita propriedades exclusivas do driver PostgreSQL
spring.datasource.hikari.data-source-properties.prepareThreshold=
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=

# JPA — deixa o Hibernate gerar o schema a partir das entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Remove o context-path para simplificar as requisições MockMvc
server.servlet.context-path=

# Propriedades obrigatórias para o contexto Spring subir
app.cors.allowed-origins=http://localhost:3000
app.cep.base-url=https://brasilapi.com.br
security.auth.max-tentativas=5
security.auth.tempo-duracao=30
security.auth.totp.emissor=ConectaPro

security.jwt.secret=test-jwt-secret-key-que-precisa-ter-pelo-menos-32-bytes-para-hmac-sha256
security.jwt.expiracao-minutos=30
security.jwt.pre-auth-expiracao-minutos=5

# Email (desabilitado em teste — JavaMailSender mockado)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
app.mail.from=noreply@conectapro.test
app.mail.reset.subject=Reset de Senha - ConectaPro
app.mail.reset.expiracao-minutos=15
app.mail.frontend-base-url=http://localhost:3000

mercadopago.access-token=TEST-fake-access-token
mercadopago.url-sucesso=http://localhost:3000/pagamento/sucesso
mercadopago.url-falha=http://localhost:3000/pagamento/falha
mercadopago.url-pendente=http://localhost:3000/pagamento/pendente
mercadopago.sandbox=true
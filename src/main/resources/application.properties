spring.application.name=conectapro
server.servlet.context-path=/api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.cep.base-url=${CEP_API_URL:https://brasilapi.com.br}

security.auth.max-tentativas=${SECURITY_AUTH_MAX_TENTATIVAS:5}
security.auth.tempo-duracao=${SECURITY_AUTH_TEMPO_DURACAO:30}
security.auth.totp.emissor=${SECURITY_AUTH_TOTP_EMISSOR:ConectaPro}

server.servlet.session.timeout=${SESSION_TIMEOUT:5m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

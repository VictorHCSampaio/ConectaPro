spring.application.name=conectapro
server.servlet.context-path=/api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.cep.base-url=${CEP_API_URL:https://brasilapi.com.br}

security.auth.max-tentativas=${SECURITY_AUTH_MAX_TENTATIVAS:5}
security.auth.tempo-duracao=${SECURITY_AUTH_TEMPO_DURACAO:30}
security.auth.totp.emissor=${SECURITY_AUTH_TOTP_EMISSOR:ConectaPro}

security.jwt.secret=${JWT_SECRET}
security.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:30}
security.jwt.pre-auth-expiracao-minutos=${JWT_PRE_AUTH_EXPIRACAO_MINUTOS:5}

# Email (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM}
app.mail.reset.subject=${MAIL_RESET_SUBJECT:Recuperação de Senha - ConectaPro}
app.mail.reset.expiracao-minutos=${MAIL_RESET_EXPIRACAO_MINUTOS:15}
app.mail.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.url-sucesso=${MERCADOPAGO_URL_SUCESSO:http://localhost:5173/pagamento/sucesso}
mercadopago.url-falha=${MERCADOPAGO_URL_FALHA:http://localhost:5173/pagamento/falha}
mercadopago.url-pendente=${MERCADOPAGO_URL_PENDENTE:http://localhost:5173/pagamento/pendente}
mercadopago.sandbox=${MERCADOPAGO_SANDBOX:true}
spring.application.name=conectapro
server.servlet.context-path=/api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.cep.base-url=${CEP_API_URL:https://brasilapi.com.br}

security.auth.max-tentativas=${SECURITY_AUTH_MAX_TENTATIVAS:5}
security.auth.tempo-duracao=${SECURITY_AUTH_TEMPO_DURACAO:30}
security.auth.totp.emissor=${SECURITY_AUTH_TOTP_EMISSOR:ConectaPro}

app.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}
app.retencao.auditoria-dias=${RETENCAO_AUDITORIA_DIAS:730}

security.jwt.secret=${JWT_SECRET}
security.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:30}
security.jwt.pre-auth-expiracao-minutos=${JWT_PRE_AUTH_EXPIRACAO_MINUTOS:5}

# Email: provider=smtp (local) ou sendgrid (producao, API HTTP na porta 443)
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.sendgrid.api-key=${SENDGRID_API_KEY:}
app.mail.sendgrid.from-name=${MAIL_FROM_NAME:ConectaPro}

# Email (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM}
app.mail.admin-address=${ADMIN_EMAIL:admin1.conectapro@gmail.com}
app.mail.reset.subject=${MAIL_RESET_SUBJECT:Recuperação de Senha - ConectaPro}
app.mail.reset.expiracao-minutos=${MAIL_RESET_EXPIRACAO_MINUTOS:15}
app.mail.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

aws.s3.access-key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.bucket-certificados=${AWS_S3_BUCKET_CERTIFICADOS:}
aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.url-sucesso=${MERCADOPAGO_URL_SUCESSO:http://localhost:5173/pagamento/sucesso}
mercadopago.url-falha=${MERCADOPAGO_URL_FALHA:http://localhost:5173/pagamento/falha}
mercadopago.url-pendente=${MERCADOPAGO_URL_PENDENTE:http://localhost:5173/pagamento/pendente}
mercadopago.sandbox=${MERCADOPAGO_SANDBOX:true}